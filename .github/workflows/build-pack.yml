name: Build building packs

# Fills OpenStreetMap's gaps with Ordnance Survey's surveyed building
# footprints, entirely on GitHub. Nothing to install.
#
#   Actions tab  ->  "Build building packs"  ->  Run workflow
#   ->  type one or more postcodes  ->  Run workflow
#
# Packs are stored per 10 km Ordnance Survey tile rather than per postcode, so
# two nearby places share their coverage instead of each carrying an
# overlapping square of its own — and building a second postcode down the road
# often costs nothing at all, because its tiles are already here.
#
# Every input reaches the shell through the environment rather than being
# pasted into the script, so a postcode containing shell characters is a
# postcode, not a command.

on:
  workflow_dispatch:
    inputs:
      places:
        description: 'Postcodes, comma separated, e.g. KT23 3HP, DH1 3LE'
        required: true
      radius:
        description: 'How far around each one to cover, in metres. 5200 is the sim''s whole square.'
        required: false
        default: '5200'
      rebuild:
        description: 'Rebuild tiles that are already in the repository'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- which 10 km tiles do these places need, and which are new? ---
      - name: Work out the tiles
        id: plan
        env:
          PLACES: ${{ inputs.places }}
          RADIUS: ${{ inputs.radius }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -uo pipefail
          HAVE=""
          if [ "$REBUILD" != "true" ]; then
            # a tile pack is named after its tile: packs/tq15.js
            HAVE=$(ls packs/*.js 2>/dev/null \
                   | sed -n 's#packs/\([a-z][a-z][0-9][0-9]\)\.js#\1#p' \
                   | tr 'a-z' 'A-Z' | paste -sd, -)
          fi
          echo "already built: ${HAVE:-none}"
          node packs/plan-tiles.js "$PLACES" --radius "$RADIUS" --have "$HAVE" > tiles.tsv
          rc=$?
          if [ "$rc" = "3" ]; then
            echo "::notice::Every tile these places need is already in the repository. Nothing to do."
            echo "nothing=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" = "0" ] || exit "$rc"
          cat tiles.tsv

      - name: Install GDAL
        if: steps.plan.outputs.nothing != '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin

      # --- one download per 100 km square, one clip, then split into tiles ---
      - name: Build them
        if: steps.plan.outputs.nothing != '1'
        run: packs/build-tiles.sh tiles.tsv

      - name: Commit them
        if: steps.plan.outputs.nothing != '1'
        env:
          PLACES: ${{ inputs.places }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/ index.html
          if git diff --cached --quiet; then
            echo "::warning::nothing changed"; exit 0
          fi
          git commit -m "Building pack tiles for $PLACES from OS OpenMap Local" \
                     -m "Contains OS data (c) Crown copyright and database right. Open Government Licence v3. Built by .github/workflows/build-pack.yml."
          git push
          echo "::notice::Tiles committed. Fly any of those postcodes — the report's pack line says how much of each was used."
