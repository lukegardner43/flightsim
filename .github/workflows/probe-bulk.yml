name: Find the bulk lidar downloads

# Read-only. Asks the Environment Agency what it serves besides the WCS, and
# prints everything with its HTTP code. Writes nothing, commits nothing.
#
# The reason it exists is a measurement: over the WCS we get 1.2 MB/s, which
# makes a 10 km tile eleven minutes and England 235 hours. The same lidar is
# published as 5 km GeoTIFFs — eight files a tile rather than two hundred
# requests. All that is missing is the URL, and guessing at one is what cost a
# whole run last time.

on:
  workflow_dispatch:
    inputs:
      tile:
        description: 'A tile to try things against'
        required: false
        default: 'TQ15'
      what:
        description: 'sources | speed | both'
        required: false
        default: 'both'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask what else is served
        if: inputs.what != 'speed'
        env:
          TILE: ${{ inputs.tile }}
        run: packs/find-bulk.sh "$TILE"

      - name: Install GDAL
        if: inputs.what != 'sources'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin

      # Serial against parallel, on the same eight squares. This is the
      # measurement England hangs on: if 3.25 s a chunk is the server
      # thinking, eight at once cost barely more than one.
      - name: Time one stream against eight
        if: inputs.what != 'sources'
        env:
          TILE: ${{ inputs.tile }}
        run: |
          set -euo pipefail
          eval "$(packs/find-lidar.sh)"
          export DSM_SLUG DSM_COV DTM_SLUG DTM_COV
          packs/time-fetch.sh "$TILE"
