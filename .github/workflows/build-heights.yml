name: Measure building heights from lidar

# Turns the sim's guessed building heights into measurements, for one
# Ordnance Survey 10 km tile at a time.
#
#   Actions tab  ->  "Measure building heights from lidar"
#   ->  type a postcode  ->  Run workflow
#
# The ground must already have a footprint pack ("Build building packs" makes
# those). This job adds a measured eaves height, roof height, ridge bearing
# and roof shape to every footprint in the square — and, where the surface
# steps, the massing inside the footprint as well, so a two storey house with
# a single storey extension is drawn as the two boxes it is.
#
# Set probe_only to stop after finding the services and reporting them. That
# takes seconds and is the cheap way to check the endpoints are alive before
# committing to a download of a hundred million samples.
#
# size says 10000 rather than being blank for the whole tile, and that is not
# cosmetic: an EMPTY workflow_dispatch input is replaced by its default, so a
# run asking for the whole tile by clearing the box measured the middle two
# kilometres instead and looked like a success. 10000 and blank mean the same
# thing to plan-square.js; only one of them survives the round trip.
#
# England only. Scotland and Wales publish equivalent surfaces under the same
# licence through different portals; see packs/README.md.
#
# Data: Environment Agency LIDAR Composite DSM/DTM 1 m, Open Government
# Licence v3. Contains public sector information.

on:
  workflow_dispatch:
    inputs:
      place:
        description: 'A postcode, or an OS 10 km tile — e.g. "KT23 3HP" or TQ15. Two letters on their own is a 100 km square, not a tile.'
        required: true
        default: 'TQ15'
      pack:
        description: 'Leave blank — the pack covering the square is found automatically. Only set this to force a particular one (e.g. kt233hp).'
        required: false
        default: ''
      size:
        description: 'Metres of square to measure, centred on the place. 10000 is the whole 10 km tile, about four minutes; 2000 is under a minute.'
        required: false
        default: '10000'
      square:
        description: 'Optional exact E,N,size, if you would rather say where than let the postcode decide'
        required: false
        default: ''
      probe_only:
        description: 'Just find the services and report what they offer'
        required: false
        default: 'false'
      dsm_url:
        description: 'Direct URL to a DSM GeoTIFF or zip covering the tile (overrides the WCS)'
        required: false
        default: ''
      dtm_url:
        description: 'Direct URL to the matching DTM'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          gdalinfo --version

      # Which tile, and which square of it, from something a person would
      # actually type. A grid reference is a poor thing to ask for: the first
      # square measured for real was one I suggested from memory, and it was
      # farmland with 136 buildings in it rather than the village with 1,724.
      - name: Work out the square
        id: ext
        env:
          PLACE: ${{ inputs.place }}
          SIZE: ${{ inputs.size }}
          SQUARE: ${{ inputs.square }}
        run: |
          set -euo pipefail
          args=("$PLACE")
          if [ -n "$SQUARE" ]; then args+=(--square "$SQUARE")
          elif [ -n "$SIZE" ]; then args+=(--size "$SIZE"); fi
          node packs/plan-square.js "${args[@]}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # DEFRA moved its lidar off Esri image services onto OGC ones and
      # renamed the DSM dataset to say which return it is, so the slug is not
      # something to hard-code from memory — the first attempt at this 404'd.
      # Each candidate is asked whether it is there and what it offers, and
      # the first that answers is used. If they all fail, the log now holds
      # enough to fix it in one go rather than by another guess.
      # packs/find-lidar.sh, because the other workflow needs it too and a
      # copied shell function is a copy that drifts. It writes the four
      # service values straight to $GITHUB_OUTPUT.
      - name: Find the lidar services
        id: wcs
        run: packs/find-lidar.sh

      - name: Stop here if only probing
        if: inputs.probe_only == 'true'
        run: |
          echo "::notice::Services found. Re-run with probe_only false to measure."
          exit 0

      # Fetched in 1 km squares.
      #
      # Two things had to be learned the hard way here. The thirty second
      # timeout is the WCS driver's OWN, set in the service description, and
      # it ignores GDAL_HTTP_TIMEOUT completely — setting that to 600 and
      # watching the log still say "timed out after 30000 milliseconds" is how
      # you find out. And the request size is the CHUNK size, not the block
      # size: each chunk is one GetCoverage, so a 2 km chunk is a 16 MB
      # response, which over this link is more than thirty seconds. A 1 km
      # chunk is 4 MB and takes about eight seconds.
      #
      # The server also returns the odd 502 under sustained load, so each
      # square gets five attempts with a lengthening pause between them.
      # packs/measure-tile.sh: fetch in 1 km squares, mosaic, normalise to the
      # tile, measure every footprint in it. Shared with build-place.yml.
      - name: Fetch and measure
        if: inputs.probe_only != 'true'
        env:
          DSM_URL: ${{ inputs.dsm_url }}
          DTM_URL: ${{ inputs.dtm_url }}
          DSM_SLUG: ${{ steps.wcs.outputs.dsm_slug }}
          DSM_COV: ${{ steps.wcs.outputs.dsm_cov }}
          DTM_SLUG: ${{ steps.wcs.outputs.dtm_slug }}
          DTM_COV: ${{ steps.wcs.outputs.dtm_cov }}
        run: |
          packs/measure-tile.sh "${{ steps.ext.outputs.tile }}" \
            "${{ steps.ext.outputs.e0 }}" "${{ steps.ext.outputs.n0 }}" \
            "${{ steps.ext.outputs.e1 }}" "${{ steps.ext.outputs.n1 }}" \
            "${{ steps.ext.outputs.size }}" "${{ inputs.pack }}"

      - name: Commit
        if: inputs.probe_only != 'true'
        env:
          TILE: ${{ steps.ext.outputs.tile }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/
          if git diff --cached --quiet; then echo "::warning::nothing changed"; exit 0; fi
          git commit -m "Measured building heights for $TILE from Environment Agency lidar" \
                     -m "Contains public sector information licensed under the Open Government Licence v3. Built by .github/workflows/build-heights.yml."
          # A run takes minutes, and anything pushed to main while it runs makes
          # its commit a non-fast-forward. That is exactly how four minutes of
          # lidar were lost: the measurement finished, the pack was written, and
          # `git push` said "! [rejected] main -> main (fetch first)" — throwing
          # away work that had already succeeded because a workflow file changed
          # underneath it.
          #
          # So: rebase onto whatever landed and try again. Rebase rather than
          # merge because this commit touches one pack and nothing else, and if
          # two measuring runs really did collide on the same pack the conflict
          # is worth stopping for rather than resolving blind.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "::notice::push rejected — something landed on main while this ran; rebasing"
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "::error::the rebase conflicted — another run measured the same pack."
              echo "::error::Nothing was pushed. Re-run this workflow; it will re-measure."
              exit 1
            fi
          done
          echo "::error::could not push after three attempts"
          exit 1
