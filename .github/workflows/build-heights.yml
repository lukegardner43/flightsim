name: Measure building heights from lidar

# Turns the sim's guessed building heights into measurements, for one
# Ordnance Survey 10 km tile at a time.
#
#   Actions tab  ->  "Measure building heights from lidar"
#   ->  type a tile, e.g. TQ15  ->  Run workflow
#
# The tile must already have a footprint pack ("Build building packs" makes
# those). This job adds a measured eaves height, roof height, ridge bearing
# and roof shape to every footprint in it, read off the Environment Agency's
# 1 m lidar surface.
#
# Set probe_only to stop after finding the services and reporting them. That
# takes seconds and is the cheap way to check the endpoints are alive before
# committing to a download of a hundred million samples.
#
# England only. Scotland and Wales publish equivalent surfaces under the same
# licence through different portals; see packs/README.md.
#
# Data: Environment Agency LIDAR Composite DSM/DTM 1 m, Open Government
# Licence v3. Contains public sector information.

on:
  workflow_dispatch:
    inputs:
      tile:
        description: 'OS 10 km tile, e.g. TQ15'
        required: true
      pack:
        description: 'Pack id to annotate, if not the tile itself (e.g. kt233hp)'
        required: false
        default: ''
      probe_only:
        description: 'Just find the services and report what they offer'
        required: false
        default: 'false'
      dsm_url:
        description: 'Direct URL to a DSM GeoTIFF or zip covering the tile (overrides the WCS)'
        required: false
        default: ''
      dtm_url:
        description: 'Direct URL to the matching DTM'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GDAL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          gdalinfo --version

      # The tile's British National Grid extent, straight from its name, so
      # the raster and the footprints cannot disagree about where they are.
      - name: Work out the extent
        id: ext
        env:
          TILE: ${{ inputs.tile }}
        run: |
          set -euo pipefail
          node -e '
            const {tileOrigin} = require("./packs/grid-square.js");
            const t = String(process.env.TILE).trim().toUpperCase();
            const o = tileOrigin(t);
            if (!o) { console.error("not a 10 km tile: " + t); process.exit(1); }
            console.log("tile=" + t);
            console.log("e0=" + o.E); console.log("n0=" + o.N);
            console.log("e1=" + (o.E + 10000)); console.log("n1=" + (o.N + 10000));
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # DEFRA moved its lidar off Esri image services onto OGC ones and
      # renamed the DSM dataset to say which return it is, so the slug is not
      # something to hard-code from memory — the first attempt at this 404'd.
      # Each candidate is asked whether it is there and what it offers, and
      # the first that answers is used. If they all fail, the log now holds
      # enough to fix it in one go rather than by another guess.
      - name: Find the lidar services
        id: wcs
        run: |
          set -uo pipefail
          base=https://environment.data.gov.uk/spatialdata
          DSM_SLUGS="lidar-composite-digital-surface-model-last-return-dsm-1m lidar-composite-digital-surface-model-dsm-1m lidar-composite-first-return-digital-surface-model-fz-dsm-1m"
          DTM_SLUGS="lidar-composite-digital-terrain-model-dtm-1m lidar-composite-digital-terrain-model-last-return-dtm-1m"
          probe() {
            local label="$1"; shift
            for s in "$@"; do
              local url="$base/$s/wcs?service=WCS&version=2.0.1&request=GetCapabilities"
              local code
              code=$(curl -s -o "cap-$label.xml" -w '%{http_code}' --max-time 90 "$url")
              echo "  $label  $s  ->  HTTP $code" >&2
              if [ "$code" = "200" ]; then
                local ids
                ids=$(grep -o '<[a-zA-Z]*:\?CoverageId>[^<]*' "cap-$label.xml" | sed 's/.*CoverageId>//' | head -20)
                echo "  coverages offered: $(echo "$ids" | tr '\n' ' ')" >&2
                if [ -z "$ids" ]; then echo "  (no CoverageId in the capabilities)" >&2; continue; fi
                printf '%s|%s' "$s" "$(echo "$ids" | head -1)"
                return 0
              fi
            done
            return 1
          }
          dsm=$(probe dsm $DSM_SLUGS) || dsm=""
          dtm=$(probe dtm $DTM_SLUGS) || dtm=""
          if [ -z "$dsm" ] || [ -z "$dtm" ]; then
            echo "::error::No lidar WCS answered — every slug above is a miss."
            echo "::error::Download the 5 km DSM and DTM tiles for this square by hand from"
            echo "::error::https://environment.data.gov.uk/survey and re-run with dsm_url / dtm_url."
            echo "--- first 40 lines of the last DSM response ---"
            head -40 cap-dsm.xml 2>/dev/null || true
            exit 1
          fi
          {
            echo "dsm_slug=${dsm%%|*}"
            echo "dsm_cov=${dsm##*|}"
            echo "dtm_slug=${dtm%%|*}"
            echo "dtm_cov=${dtm##*|}"
          } >> "$GITHUB_OUTPUT"
          echo "using DSM ${dsm%%|*} coverage ${dsm##*|}"
          echo "using DTM ${dtm%%|*} coverage ${dtm##*|}"

      - name: Stop here if only probing
        if: inputs.probe_only == 'true'
        run: |
          echo "::notice::Services found. Re-run with probe_only false to measure."
          exit 0

      # One warp each, to exactly the tile, exactly 1 m, as raw float32. The
      # geometry is then implied by the tile id and make-heights.js does not
      # have to parse a header to find out where it is.
      - name: Fetch and normalise to the tile
        if: inputs.probe_only != 'true'
        env:
          DSM_URL: ${{ inputs.dsm_url }}
          DTM_URL: ${{ inputs.dtm_url }}
          DSM_SLUG: ${{ steps.wcs.outputs.dsm_slug }}
          DSM_COV: ${{ steps.wcs.outputs.dsm_cov }}
          DTM_SLUG: ${{ steps.wcs.outputs.dtm_slug }}
          DTM_COV: ${{ steps.wcs.outputs.dtm_cov }}
          E0: ${{ steps.ext.outputs.e0 }}
          N0: ${{ steps.ext.outputs.n0 }}
          E1: ${{ steps.ext.outputs.e1 }}
          N1: ${{ steps.ext.outputs.n1 }}
        run: |
          set -euo pipefail
          fetch() {   # $1 dsm|dtm   $2 direct url   $3 slug   $4 coverage
            local src
            if [ -n "$2" ]; then
              curl -fsSL --retry 3 --retry-delay 5 -o "$1.raw" "$2"
              if file "$1.raw" | grep -qi zip; then
                mkdir -p "$1.d"
                unzip -qo "$1.raw" -d "$1.d"
                rm "$1.raw"
                find "$1.d" \( -iname '*.tif' -o -iname '*.tiff' -o -iname '*.asc' \) > "$1.list"
              else
                echo "$1.raw" > "$1.list"
              fi
              wc -l < "$1.list"
              gdalbuildvrt -q -input_file_list "$1.list" "$1.vrt"
              src="$1.vrt"
            else
              node packs/wcs-service.js "$3" "$4" > "$1.xml"
              cat "$1.xml"
              gdalinfo "$1.xml" | head -25
              src="$1.xml"
            fi
            gdalwarp -overwrite -t_srs EPSG:27700 \
              -te "$E0" "$N0" "$E1" "$N1" -tr 1 1 -r bilinear \
              -ot Float32 -dstnodata -9999 -of ENVI "$src" "$1.img"
            ls -la "$1.img"
          }
          fetch dsm "$DSM_URL" "$DSM_SLUG" "$DSM_COV"
          fetch dtm "$DTM_URL" "$DTM_SLUG" "$DTM_COV"

      - name: Measure
        if: inputs.probe_only != 'true'
        env:
          TILE: ${{ inputs.tile }}
          PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          args=(--tile "$TILE" --dsm dsm.img --dtm dtm.img)
          if [ -n "$PACK" ]; then args+=(--pack "$PACK"); fi
          node --max-old-space-size=6144 packs/make-heights.js "${args[@]}"

      - name: Commit
        if: inputs.probe_only != 'true'
        env:
          TILE: ${{ inputs.tile }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/
          if git diff --cached --quiet; then echo "::warning::nothing changed"; exit 0; fi
          git commit -m "Measured building heights for $TILE from Environment Agency lidar" \
                     -m "Contains public sector information licensed under the Open Government Licence v3. Built by .github/workflows/build-heights.yml."
          git push
